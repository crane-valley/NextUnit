name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Job 1: Build with caching (shared by other jobs)
  build:
    name: Build & Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore NextUnit.CI.slnx

    - name: Build Release
      run: dotnet build NextUnit.CI.slnx --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: |
          src/**/bin/Release/
          samples/**/bin/Release/
          samples/**/obj/Release/**/NextUnit.Generator/
        retention-days: 1

  # Job 2: Run tests (uses build artifacts)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore NextUnit.slnx

    - name: Run full solution tests
      run: dotnet test --solution NextUnit.slnx --configuration Release --no-restore

  # Job 3: Code quality checks (lightweight, no build needed)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Intentionally format NextUnit.slnx, the superset of strict-build's NextUnit.CI.slnx, to cover tests, benchmarks, samples, and tools.
    - name: Check code formatting
      run: dotnet format NextUnit.slnx --verify-no-changes --verbosity minimal

    - name: Check required files
      run: |
        for file in README.md .editorconfig; do
          [ -f "$file" ] && echo "✓ $file" || { echo "✗ $file missing"; exit 1; }
        done

    - name: Check .editorconfig
      run: grep -q "root = true" .editorconfig && echo "✓ .editorconfig valid"

    - name: Verify project structure
      run: |
        for p in src/NextUnit.Core/NextUnit.Core.csproj \
                 src/NextUnit.Generator/NextUnit.Generator.csproj \
                 src/NextUnit.Platform/NextUnit.Platform.csproj \
                 samples/NextUnit.SampleTests/NextUnit.SampleTests.csproj; do
          [ -f "$p" ] && echo "✓ $p" || { echo "✗ $p missing"; exit 1; }
        done

  # Job 4: Security scan
  #
  # Blocking, and scoped to what the pull request changes: the gate compares the vulnerabilities the
  # head revision resolves against the ones the base revision already resolves, and fails only on the
  # difference. An advisory published against a package main already carries therefore leaves
  # unrelated pull requests green; the nightly Vulnerability Scan job owns those.
  #
  # The diff has no meaning outside a pull request, so the job does not run on push.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # After the cache step on purpose: a second copy of the repository inside the workspace would
    # otherwise feed the hashFiles globs above and give this job a cache key no other job shares.
    - name: Checkout base revision
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base-revision

    # NextUnit.slnx rather than NextUnit.CI.slnx: a pull request can add a vulnerable package to a
    # test, benchmark, or tool project just as easily as to a shipped one. The two package smoke
    # projects belong to no solution, so they are named directly; the script fails on any project it
    # finds in the tree that none of these targets reach.
    - name: Fail on newly introduced vulnerable packages
      run: >
        pwsh -NoProfile -File .github/scripts/check-dependency-vulnerabilities.ps1
        -Target NextUnit.slnx,tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj,tests/NextUnit.AspNetCore.PackageSmoke/NextUnit.AspNetCore.PackageSmoke.csproj
        -Allowlist .github/vulnerability-allowlist.txt
        -BaselinePath base-revision

  # Job 5: Verify generator output
  generator:
    name: Generator Validation
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-output
        path: .

    - name: Verify generator output exists
      run: |
        if find samples/NextUnit.SampleTests -name "*.g.cs" -type f 2>/dev/null | grep -q .; then
          echo "✓ Generator produced output"
          find samples/NextUnit.SampleTests -name "*.g.cs" -type f | head -5
        else
          echo "⚠️ No generated files found"
        fi

  package-smoke:
    name: Package Integration
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/package-smoke/packages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Pack local packages
      run: |
        dotnet pack src/NextUnit.Core/NextUnit.Core.csproj --configuration Release --output artifacts/packages
        dotnet pack src/NextUnit.Platform/NextUnit.Platform.csproj --configuration Release --output artifacts/packages
        dotnet pack src/NextUnit.AspNetCore/NextUnit.AspNetCore.csproj --configuration Release --output artifacts/packages
        dotnet pack src/NextUnit/NextUnit.csproj --configuration Release --output artifacts/packages

    - name: Verify one-package integration
      run: |
        dotnet restore tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
          --configfile .github/NextUnit.PackageSmoke.NuGet.Config \
          -p:UseLocalNextUnitPackage=true
        dotnet run --project tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
          --configuration Release \
          --no-restore \
          -p:UseLocalNextUnitPackage=true \
          -- --minimum-expected-tests 8
        # Discovery is checked separately from the run because the two report different totals and
        # only the run total was ever verified: a discovery request that publishes nodes the platform
        # does not count reports an empty assembly while the run still passes every test. Seven, not
        # eight, because the deferred source is one placeholder until the run expands it.
        list_output=$(dotnet run --project tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
          --configuration Release \
          --no-restore \
          -p:UseLocalNextUnitPackage=true \
          -- --list-tests)
        echo "$list_output"
        if ! grep -q "found 7 test(s)" <<<"$list_output"; then
          echo "Error: --list-tests did not report the seven discoverable tests of the package smoke project."
          exit 1
        fi
        dotnet restore tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
          --configfile .github/NextUnit.PackageSmoke.NuGet.Config \
          --runtime linux-x64 \
          -p:UseLocalNextUnitPackage=true \
          -p:PublishAotPackageSmoke=true
        dotnet publish tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --no-restore \
          --output artifacts/package-smoke-aot \
          -p:UseLocalNextUnitPackage=true \
          -p:PublishAotPackageSmoke=true
        chmod +x artifacts/package-smoke-aot/NextUnit.PackageSmoke
        artifacts/package-smoke-aot/NextUnit.PackageSmoke --minimum-expected-tests 8
        dotnet restore tests/NextUnit.AspNetCore.PackageSmoke/NextUnit.AspNetCore.PackageSmoke.csproj \
          --configfile .github/NextUnit.PackageSmoke.NuGet.Config \
          -p:UseLocalNextUnitPackage=true
        dotnet run --project tests/NextUnit.AspNetCore.PackageSmoke/NextUnit.AspNetCore.PackageSmoke.csproj \
          --configuration Release \
          --no-restore \
          -p:UseLocalNextUnitPackage=true \
          -- --minimum-expected-tests 1

  template-smoke:
    name: Template Integration
    runs-on: ubuntu-latest
    env:
      # A run-scoped packages folder is what makes this check hermetic. NuGet serves a package from
      # the global packages folder without consulting any source, so a warm cache holding the
      # published NextUnit of the same version would silently replace the one packed here.
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/template-smoke/packages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Verify the template pins the repository version of NextUnit
      shell: bash
      run: |
        template_project=src/NextUnit.Templates/templates/NextUnit-CSharp/Company.TestProject1.csproj.template
        repo_version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)
        template_version=$(sed -n 's/.*Include="NextUnit" Version="\([^"]*\)".*/\1/p' "$template_project")
        if [ -z "$repo_version" ] || [ "$repo_version" != "$template_version" ]; then
          echo "Error: $template_project pins NextUnit '$template_version' but Directory.Build.props declares '$repo_version'."
          echo "The template ships as content and cannot resolve its version through Directory.Packages.props;"
          echo "see the Version Update Checklist in docs/RELEASE_PROCESS.md."
          exit 1
        fi
        echo "PACKAGE_VERSION=$repo_version" >> "$GITHUB_ENV"
        # Generated outside the workspace on purpose: inside it this repository's
        # Directory.Build.props and central package management would apply to the generated project,
        # and the check would stop measuring what a consumer actually gets. Set here rather than in
        # the job's env: block, where the runner context is not available.
        echo "TEMPLATE_OUTPUT_DIR=$RUNNER_TEMP/nextunit-template-smoke" >> "$GITHUB_ENV"

    - name: Pack NextUnit and the template package
      run: |
        dotnet pack src/NextUnit.Core/NextUnit.Core.csproj --configuration Release --output artifacts/packages
        dotnet pack src/NextUnit.Platform/NextUnit.Platform.csproj --configuration Release --output artifacts/packages
        dotnet pack src/NextUnit/NextUnit.csproj --configuration Release --output artifacts/packages
        dotnet pack src/NextUnit.Templates/NextUnit.Templates.csproj --configuration Release --output artifacts/packages

    - name: Install the template
      run: dotnet new install "${{ github.workspace }}/artifacts/packages/NextUnit.Templates.$PACKAGE_VERSION.nupkg"

    - name: Create a project from the template
      shell: bash
      run: |
        dotnet new nextunit --name TemplateSmoke --output "$TEMPLATE_OUTPUT_DIR/TemplateSmoke" --no-restore
        # Source mapping, not source order, is what keeps the template content off nuget.org: the
        # pinned version also exists there, and without a mapping either copy could win the restore.
        cat > "$TEMPLATE_OUTPUT_DIR/TemplateSmoke/NuGet.Config" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local-nextunit" value="${{ github.workspace }}/artifacts/packages" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="local-nextunit">
              <package pattern="NextUnit*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    - name: Restore, build, and run the generated project
      shell: bash
      run: |
        project="$TEMPLATE_OUTPUT_DIR/TemplateSmoke/TemplateSmoke.csproj"
        dotnet restore "$project"
        # Proves the source mapping actually held. Without this the job would still pass against a
        # NextUnit downloaded from nuget.org, which is the one thing it exists to rule out.
        metadata="$NUGET_PACKAGES/nextunit/$PACKAGE_VERSION/.nupkg.metadata"
        if ! grep -q "${{ github.workspace }}/artifacts/packages" "$metadata"; then
          echo "Error: NextUnit $PACKAGE_VERSION was not restored from the locally packed feed."
          cat "$metadata"
          exit 1
        fi
        dotnet build "$project" --configuration Release --no-restore
        # --minimum-expected-tests fails the run when fewer tests than expected are reported, so a
        # zero exit code proves the example test was both discovered and passed.
        dotnet run --project "$project" \
          --configuration Release \
          --no-build \
          -- --minimum-expected-tests 1
        # A discovery-only request is its own code path, and a consumer's IDE takes it before it ever
        # runs anything: the platform reports no tests and exits non-zero when a published node is
        # not marked as discovered, however well the run behaves.
        list_output=$(dotnet run --project "$project" \
          --configuration Release \
          --no-build \
          -- --list-tests)
        echo "$list_output"
        if ! grep -q "found 1 test(s)" <<<"$list_output"; then
          echo "Error: --list-tests did not report the example test of the generated project."
          exit 1
        fi

    - name: Uninstall the template
      shell: bash
      run: |
        dotnet new uninstall NextUnit.Templates
        if dotnet new uninstall | grep -q "NextUnit.Templates"; then
          echo "Error: NextUnit.Templates is still installed after uninstall."
          exit 1
        fi

  # Summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, test, code-quality, security, generator, package-smoke, template-smoke]
    if: always()

    steps:
    - name: Check results
      run: |
        echo "=== CI Summary ==="
        echo "Build: ${{ needs.build.result }}"
        echo "Test: ${{ needs.test.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Generator: ${{ needs.generator.result }}"
        echo "Package Integration: ${{ needs.package-smoke.result }}"
        echo "Template Integration: ${{ needs.template-smoke.result }}"

        [[ "${{ needs.build.result }}" == "success" ]] || exit 1
        [[ "${{ needs.test.result }}" == "success" ]] || exit 1
        [[ "${{ needs.package-smoke.result }}" == "success" ]] || exit 1
        [[ "${{ needs.template-smoke.result }}" == "success" ]] || exit 1
        echo "✅ All critical checks passed"
