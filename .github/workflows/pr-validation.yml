name: PR Validation

on:
  pull_request:
    # edited is here for major-bump-guard: it reads the PR body, so a body edited after a green
    # run would otherwise leave a stale pass behind and let a justification be deleted post-check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Job 1: PR metadata and changed files analysis (lightweight)
  pr-analysis:
    name: PR Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check PR title format
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        if [[ "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|chore|perf|ci|build|style):\ .+ ]]; then
          echo "✓ PR title follows conventional format"
        else
          echo "⚠️ PR title should follow: type: description"
        fi

    - name: Analyze changed files
      run: |
        echo "=== Changed Files ==="
        git diff --name-only origin/main...HEAD
        echo ""
        echo "Core: $(git diff --name-only origin/main...HEAD | grep -c 'src/NextUnit.Core' || echo 0)"
        echo "Generator: $(git diff --name-only origin/main...HEAD | grep -c 'src/NextUnit.Generator' || echo 0)"
        echo "Tests: $(git diff --name-only origin/main...HEAD | grep -c 'samples/' || echo 0)"
        echo "Docs: $(git diff --name-only origin/main...HEAD | grep -c '\.md$' || echo 0)"

  # Job 2: Strict build with caching
  strict-build:
    name: Strict Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore NextUnit.CI.slnx

    - name: Build Release (strict mode)
      run: dotnet build NextUnit.CI.slnx --configuration Release --no-restore

    - name: Verify no warnings
      run: |
        dotnet build NextUnit.CI.slnx --configuration Release --no-restore 2>&1 | tee build.log
        if grep -E ": warning [A-Z]{2,}[0-9]+:" build.log; then
          echo "⚠️ Build warnings found"
          exit 1
        fi
        echo "✓ No build warnings"

  # Job 3: Code format check (lightweight)
  format-check:
    name: Code Format
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Intentionally format NextUnit.slnx, the superset of strict-build's NextUnit.CI.slnx, to cover tests, benchmarks, samples, and tools.
    - name: Check code formatting
      run: dotnet format NextUnit.slnx --verify-no-changes --verbosity minimal

  # Job 4: Dependencies check (lightweight)
  dependency-check:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Check dependencies
      run: |
        dotnet restore NextUnit.CI.slnx
        echo "=== NextUnit.Core Dependencies ==="
        dotnet list src/NextUnit.Core/NextUnit.Core.csproj package

  # Job 5: Release guard for MAJOR bumps and back-to-back releases.
  # Like every other job here, this one runs the workflow and script from the pull request's own
  # head, so a PR that edits the guard is judged by the edited guard. Moving the logic to a
  # required workflow in a separate trusted repository would close that, at the cost of a second
  # repository in the release path; for a single-repository project, review of changes under
  # .github/ is the control that stays.
  major-bump-guard:
    name: Major Bump Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # actions/checkout fetches with --no-tags unless fetch-tags is set, and the guard measures
    # the cadence from the newest release tag. Fetching explicitly rather than relying on the
    # action's fetch-tags input: an input the action version silently ignores would leave the
    # guard with no tag, and it fails closed, which would block every release PR.
    - name: Fetch release tags
      run: git fetch --tags --force origin

    - name: Check version bump and release cadence
      env:
        # The PR body is untrusted input: it reaches the script only through this variable,
        # never through workflow interpolation into the shell source.
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # HEAD is the pull_request merge ref, so this compares the base against what merging would
      # actually put on the base branch; head.sha alone would miss a version the merge produces.
      # Both sides are read as blobs so that the compared content is the committed content.
      run: |
        if git diff --quiet "$BASE_SHA" HEAD -- Directory.Build.props; then
          echo "Directory.Build.props unchanged; guard not applicable."
          exit 0
        fi
        BASE_PROPS="$(mktemp)"
        HEAD_PROPS="$(mktemp)"
        git show "$BASE_SHA:Directory.Build.props" > "$BASE_PROPS"
        git show HEAD:Directory.Build.props > "$HEAD_PROPS"
        bash .github/scripts/major-bump-guard.sh "$BASE_PROPS" "$HEAD_PROPS"

  # Summary
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-analysis, strict-build, format-check, dependency-check, major-bump-guard]
    if: always()

    steps:
    - name: Summary
      run: |
        echo "=== PR Validation Summary ==="
        echo "PR Analysis: ${{ needs.pr-analysis.result }}"
        echo "Strict Build: ${{ needs.strict-build.result }}"
        echo "Format Check: ${{ needs.format-check.result }}"
        echo "Dependencies: ${{ needs.dependency-check.result }}"
        echo "Major Bump Guard: ${{ needs.major-bump-guard.result }}"

        [[ "${{ needs.strict-build.result }}" == "success" ]] || exit 1
        [[ "${{ needs.format-check.result }}" == "success" ]] || exit 1
        [[ "${{ needs.major-bump-guard.result }}" == "success" ]] || exit 1
        echo "✅ All PR checks passed"
