name: Release

on:
  release:
    types: [published]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token for NuGet Trusted Publishing
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/packages-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "Error: package version not found in Directory.Build.props"
            exit 1
          fi
          NEXTUNIT_VERSION=$(sed -n 's/.*<NextUnitVersion>\([^<]*\)<\/NextUnitVersion>.*/\1/p' Directory.Packages.props)
          if [ "$NEXTUNIT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Directory.Packages.props NextUnitVersion '$NEXTUNIT_VERSION' does not match Directory.Build.props Version '$PACKAGE_VERSION'"
            exit 1
          fi
          if [ "v$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "Error: release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore NextUnit.slnx

      - name: Build
        run: dotnet build NextUnit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution NextUnit.slnx --configuration Release --no-build

      - name: Pack all packages
        run: |
          echo "Packing NextUnit.Core..."
          dotnet pack src/NextUnit.Core/NextUnit.Core.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packing NextUnit.Generator..."
          dotnet pack src/NextUnit.Generator/NextUnit.Generator.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packing NextUnit.Platform..."
          dotnet pack src/NextUnit.Platform/NextUnit.Platform.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packing NextUnit.TestAdapter..."
          dotnet pack src/NextUnit.TestAdapter/NextUnit.TestAdapter.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packing NextUnit.AspNetCore..."
          dotnet pack src/NextUnit.AspNetCore/NextUnit.AspNetCore.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packing NextUnit meta-package..."
          dotnet pack src/NextUnit/NextUnit.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packing NextUnit.Templates..."
          dotnet pack src/NextUnit.Templates/NextUnit.Templates.csproj \
            --configuration Release \
            --output ./artifacts/packages \
            --no-build

          echo "Packages created:"
          ls -lh ./artifacts/packages/*.nupkg

      - name: Verify package contents
        shell: bash
        run: |
          packages=(
            NextUnit
            NextUnit.Core
            NextUnit.Generator
            NextUnit.Platform
            NextUnit.TestAdapter
            NextUnit.AspNetCore
            NextUnit.Templates
          )
          for package in "${packages[@]}"; do
            path="./artifacts/packages/$package.$PACKAGE_VERSION.nupkg"
            if [ ! -f "$path" ]; then
              echo "Error: required package not found: $path"
              exit 1
            fi
            echo "Verified $path"
          done
          package_count=$(find ./artifacts/packages -maxdepth 1 -type f -name '*.nupkg' | wc -l)
          if [ "$package_count" -ne "${#packages[@]}" ]; then
            echo "Error: expected ${#packages[@]} packages, found $package_count"
            exit 1
          fi

      - name: Verify one-package integration
        run: |
          dotnet restore tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
            --configfile .github/NextUnit.PackageSmoke.NuGet.Config \
            -p:UseLocalNextUnitPackage=true
          dotnet run --project tests/NextUnit.PackageSmoke/NextUnit.PackageSmoke.csproj \
            --configuration Release \
            --no-restore \
            -p:UseLocalNextUnitPackage=true \
            -- --minimum-expected-tests 2
          dotnet restore tests/NextUnit.AspNetCore.PackageSmoke/NextUnit.AspNetCore.PackageSmoke.csproj \
            --configfile .github/NextUnit.PackageSmoke.NuGet.Config \
            -p:UseLocalNextUnitPackage=true
          dotnet run --project tests/NextUnit.AspNetCore.PackageSmoke/NextUnit.AspNetCore.PackageSmoke.csproj \
            --configuration Release \
            --no-restore \
            -p:UseLocalNextUnitPackage=true \
            -- --minimum-expected-tests 1

      # The template ships as content, so neither the solution build nor the package smoke above
      # compiles a single line of it: a missing .template.config, a malformed template.json, or a
      # stale pinned version would reach nuget.org unnoticed. A published version is immutable, so
      # this repeats the dotnet.yml template check here rather than trusting that it ran on the
      # tagged commit.
      - name: Verify template integration
        shell: bash
        env:
          TEMPLATE_OUTPUT_DIR: ${{ runner.temp }}/nextunit-template-release-check
        run: |
          template_project=src/NextUnit.Templates/templates/NextUnit-CSharp/Company.TestProject1.csproj
          template_version=$(sed -n 's/.*Include="NextUnit" Version="\([^"]*\)".*/\1/p' "$template_project")
          if [ "$template_version" != "$PACKAGE_VERSION" ]; then
            echo "Error: $template_project pins NextUnit '$template_version' but this release is '$PACKAGE_VERSION'."
            echo "See the Version Update Checklist in docs/RELEASE_PROCESS.md."
            exit 1
          fi
          dotnet new install "${{ github.workspace }}/artifacts/packages/NextUnit.Templates.$PACKAGE_VERSION.nupkg"
          dotnet new nextunit --name TemplateSmoke --output "$TEMPLATE_OUTPUT_DIR/TemplateSmoke" --no-restore
          # Source mapping keeps NextUnit* on the packages this run just built. The same version may
          # already exist on nuget.org from a re-run, and either copy could otherwise win.
          cat > "$TEMPLATE_OUTPUT_DIR/TemplateSmoke/NuGet.Config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-nextunit" value="${{ github.workspace }}/artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local-nextunit">
                <package pattern="NextUnit*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          project="$TEMPLATE_OUTPUT_DIR/TemplateSmoke/TemplateSmoke.csproj"
          dotnet restore "$project"
          dotnet build "$project" --configuration Release --no-restore
          dotnet run --project "$project" --configuration Release --no-build -- --minimum-expected-tests 1

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
